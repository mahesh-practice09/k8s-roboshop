
---

apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop 
    tier: frontend
    component: frontend 
spec:
  replicas: 1
  selector:
    matchLabels:
       project: roboshop 
       tier: frontend
       component: frontend
  template:
     metadata:
       labels: 
           project: roboshop 
           tier: frontend
           component: frontend
     spec:
       containers:
         - name: frontend
           image: mahesh050917/frontend:1.4.0
           imagePullPolicy: Always
           resources:
              requests:
               cpu: 100m
               memory: "64Mi"
              limits:
                cpu: 200m
                memory: "128Mi"
           readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
           livenessProbe:
             httpGet: 
              path: /
              port: 80
             failureThreshold: 2
             periodSeconds: 10
---
apiVersion: v1 
kind: Service 
metadata:
  name: frontend
  namespace: roboshop
spec:
  type: LoadBalancer
  selector:
      project: roboshop 
      tier: frontend
      component: frontend
  ports:
    - protocol: TCP 
      port: 80  # Service Port
      targetPort: 80 # Container Port