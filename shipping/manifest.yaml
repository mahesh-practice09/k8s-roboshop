---
 apiVersion: v1 
 kind: ConfigMap
 metadata: 
  name: shipping
  labels:
    project: roboshop 
    tier: backend
    component: shipping
 data:
     CART_ENDPOINT: "cart:8080" 
     DB_HOST: "mysql"
---
apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: shipping
  namespace: roboshop
  labels:
    project: roboshop 
    tier: backend
    component: shipping 
spec:
  replicas: 1
  selector:
    matchLabels:
       project: roboshop 
       tier: backend
       component: shipping
  template:
     metadata:
       labels: 
           project: roboshop 
           tier: backend
           component: shipping
     spec:
       containers:
         - name: shipping
           image: mahesh050917/shipping:1.4.0
           imagePullPolicy: Always
           envFrom: 
            - configMapRef:
                name: shipping
           resources:
              requests:
               cpu: 100m
               memory: "64Mi"
              limits:
                cpu: 200m
                memory: "128Mi"
           startupProbe: 
            httpGet:
               path: /health
            port: 8080
            failureThreshold: 30
            periodSeconds: 10
           readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
           livenessProbe:
             httpGet: 
              path: /health
              port: 8080
             failureThreshold: 5
             periodSeconds: 15
---
apiVersion: v1 
kind: Service 
metadata:
  name: shipping
  namespace: roboshop
spec:
  selector:
      project: roboshop 
      tier: backend
      component: shipping
  ports:
    - protocol: TCP 
      port: 8080  # Service Port
      targetPort: 8080 # Container Port