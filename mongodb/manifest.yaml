apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop 
    tier: db
    component: mongodb 
spec:
  replicas: 1
  selector:
    matchLabels:
       project: roboshop 
       tier: db
       component: mongodb
  template:
     metadata:
       labels: 
           project: roboshop 
           tier: db
           component: mongodb
     spec:
       containers:
         - name: mongodb
           image: mahesh050917/mongodb:1.0.0
---
apiVersion: v1 
kind: Service 
metadata:
  name: mongodb
  namespace: roboshop
spec:
  selector:
      project: roboshop 
      tier: db
      component: mongodb
  ports:
    - protocol: TCP 
      port: 27017  # Service Port
      targetPort: 27017 # Container Port