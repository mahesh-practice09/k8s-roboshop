apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop 
    tier: backend
    component: catalogue 
spec:
  replicas: 1
  selector:
    matchLabels:
       project: roboshop 
       tier: backend
       component: catalogue
  template:
     metadata:
       labels: 
           project: roboshop 
           tier: backend
           component: catalogue
     spec:
       containers:
         - name: catalogue
           image: mahesh050917/catalogue:1.0.0
---
apiVersion: v1 
kind: Service 
metadata:
  name: catalogue
  namespace: roboshop
spec:
  selector:
      project: roboshop 
      tier: backend
      component: catalogue
  ports:
    - protocol: TCP 
      port: 8080  # Service Port
      targetPort: 8080 # Container Port