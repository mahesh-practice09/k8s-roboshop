---
 apiVersion: v1 
 kind: ConfigMap
 metadata: 
  name: rabbitmq
  labels:
    project: roboshop 
    tier: backend
    component: rabbitmq
 data:
   RABBITMQ_DEFAULT_USER: "roboshop"
   RABBITMQ_DEFAULT_PASS: "roboshop123"
---

apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop 
    tier: db
    component: rabbitmq 
spec:
  replicas: 1
  selector:
    matchLabels:
       project: roboshop 
       tier: db
       component: rabbitmq
  template:
     metadata:
       labels: 
           project: roboshop 
           tier: db
           component: rabbitmq
     spec:
       containers:
         - name: rabbitmq
           image: rabbitmq:3
       envFrom: 
        - configMapRef:
          name: rabbitmq
---
apiVersion: v1 
kind: Service 
metadata:
  name: rabbitmq
  namespace: roboshop
spec:
  selector:
      project: roboshop 
      tier: db
      component: rabbitmq
  ports:
    - protocol: TCP 
      port: 5672  # Service Port
      targetPort: 5672 # Container Port