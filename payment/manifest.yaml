---
 apiVersion: v1 
 kind: ConfigMap
 metadata: 
  name: payment
  labels:
    project: roboshop 
    tier: backend
    component: payment
 data:
      CART_HOST: "cart"
      CART_PORT: "8080"
      USER_HOST: "user" 
      USER_PORT: "8080"
      AMQP_HOST: "rabbitmq"
      AMQP_USER: "roboshop"
      AMQP_PASS: "roboshop123"
      
---

apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: payment
  namespace: roboshop
  labels:
    project: roboshop 
    tier: backend
    component: payment 
spec:
  replicas: 1
  selector:
    matchLabels:
       project: roboshop 
       tier: backend
       component: payment
  template:
     metadata:
       labels: 
           project: roboshop 
           tier: backend
           component: payment
     spec:
       containers:
         - name: payment
           image: mahesh050917/payment:1.4.0
           imagePullPolicy: Always
           envFrom: 
            - configMapRef:
                name: payment
           resources:
              requests:
               cpu: 100m
               memory: "64Mi"
              limits:
                cpu: 200m
                memory: "128Mi"
           readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
           livenessProbe:
             httpGet: 
              path: /health
              port: 8080
             failureThreshold: 2
             periodSeconds: 10
---
apiVersion: v1 
kind: Service 
metadata:
  name: payment
  namespace: roboshop
spec:
  selector:
      project: roboshop 
      tier: backend
      component: payment
  ports:
    - protocol: TCP 
      port: 8080  # Service Port
      targetPort: 8080 # Container Port